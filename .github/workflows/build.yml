name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build:
    name: Windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out next version
        id: ver
        shell: bash
        run: |
          latest=$(git tag --list | grep -E '^v1\.[0-9]+\.1$' | sed -E 's/^v1\.([0-9]+)\.1$/\1/' | sort -n | tail -1 || true)
          if [ -z "$latest" ]; then latest=2; fi
          next=$((latest + 1))
          echo "version=v1.${next}.1" >> "$GITHUB_OUTPUT"

      - name: Write version into mod.json
        shell: bash
        run: |
          sed -i -E 's/"version": *"[^"]*"/"version": "${{ steps.ver.outputs.version }}"/' mod.json
          cat mod.json

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Collect .geode file
        shell: bash
        run: |
          mkdir -p release
          find "$GITHUB_WORKSPACE" -name '*.geode' -not -path "$GITHUB_WORKSPACE/release/*" -exec cp {} release/ \;
          ls -la release
          if ! ls release/*.geode > /dev/null 2>&1; then
            echo "No .geode file found"
            exit 1
          fi

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Editor Eyedropper ${{ steps.ver.outputs.version }}
          make_latest: true
          files: release/*.geode
